# Retron系统挖掘流程 v2.0 配置文件
# 使用: python main_pipeline.py -c config_v2.yaml

# ============================================================
# 路径配置
# ============================================================
paths:
  # RT查询序列目录（已知的Retron RT参考序列）
  query_dir: /home/teng/BGCdetection/target_BGC_mining/retron/reference

  # 基因组蛋白序列目录 (.faa文件)
  faa_dir: /home/teng/claude_code/retron/faa_failes

  # 基因组核酸序列目录 (.fasta文件)
  fasta_dir: /home/teng/claude_code/retron/fasta_files

  # antiSMASH结果目录
  antismash_dir: /home/teng/claude_code/retron/antismash_files

  # 输出目录
  output_dir: /home/teng/claude_code/retron/pipeline_v2/output

# ============================================================
# 搜索参数 (Step 1)
# ============================================================
search:
  # 最小序列相似度 (%)
  # 注意: 25%是发现远缘Retron的阈值，会产生较多候选
  min_identity: 25

  # 最小覆盖度 (%)
  min_coverage: 40

  # 批处理大小
  batch_size: 100

# ============================================================
# 上游序列提取参数 (Step 4)
# ============================================================
flanking:
  # 上游提取长度 (bp)
  # ncRNA通常在RT起始密码子上游200-500bp范围内
  upstream: 600

  # RT头部重叠区长度 (bp)
  head_overlap: 50

# ============================================================
# RNA结构筛选参数 (Step 5)
# ============================================================
rna_filter:
  # 滑动窗口大小 (bp)
  window_size: 150

  # 滑动步长 (bp)
  step_size: 10

  # 最小自由能阈值 (kcal/mol)
  # 对于高GC生物，可以适当放宽
  min_mfe: -15.0

  # 颈部闭合最小配对数
  min_neck_pairs: 3

  # 是否要求存在分支G
  # 建议: 初筛时设为false，后续精筛时设为true
  require_branch_g: true

  # 最小茎长度 (bp) - 用于评分，不作为硬过滤条件
  min_stem: 8

# ============================================================
# 邻近基因参数 (Step 6)
# ============================================================
neighbors:
  # 上下游各提取的基因数量
  num_neighbors: 5

# ============================================================
# 防御岛分析参数 (Step 7)
# ============================================================
defense:
  # 防御系统距离阈值 (bp)
  # 在此距离内的防御系统被认为是"附近"
  distance_threshold: 10000

# ============================================================
# 流程控制
# ============================================================
pipeline:
  # 起始步骤 (1-9)
  # 1=从头开始, 2=跳过搜索
  start_step: 1

  # 结束步骤 (1-9)
  end_step: 9

  # 已有的搜索结果文件（如果start_step > 1）
  # existing_search_results: /path/to/complete_results.tsv

  # 是否跳过防御岛分析（如果DefenseFinder运行太慢）
  skip_defense: false

# ============================================================
# 通用参数
# ============================================================
general:
  # 线程数
  threads: 8

  # 详细输出
  verbose: false
