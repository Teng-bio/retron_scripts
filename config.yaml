# Retron系统挖掘流程 v2.1 配置文件
# 方法: Mestre et al., 2020 NAR - 统计关联分析
# 使用: python main_pipeline.py -c config.yaml

# ============================================================
# 路径配置
# ============================================================
paths:
  # RT查询序列目录（已知的Retron RT参考序列，用于Step 1 DIAMOND搜索）
  query_dir: /home/teng/claude_code/retron/database/query_fasta

  # RT参考序列目录（用于Step 3系统发育分析）
  # 包含12条已知Retron RT参考序列: Ec67, Ec86, Ec73, Ec83, Ec48, Ec107, Ec78, MX65, ML162, Sa163, Vc95, Se72
  reference_dir: /home/teng/claude_code/retron/database/rt_reference

  # 基因组蛋白序列目录 (.faa文件)
  faa_dir: /home/teng/claude_code/retron/faa_failes

  # 基因组核酸序列目录 (.fasta文件)
  fasta_dir: /home/teng/claude_code/retron/fasta_files

  # antiSMASH结果目录 (用于提取邻近基因注释)
  antismash_dir: /home/teng/claude_code/retron/antismash_files

  # 输出目录
  output_dir: /home/teng/claude_code/retron/pipeline_v2/output_hmmer

# ============================================================
# HMM搜索参数 (Step 1, v2.1 新增) - 推荐方法
# ============================================================
# 使用自建 Retron RT HMM 模型进行搜索，比 DIAMOND 更精确
# 首先需要运行 bash build_retron_hmm.sh 构建 HMM 模型
hmm_search:
  # 是否使用HMM搜索（默认false，使用DIAMOND）
  # 命令行: --use-hmm
  use_hmm: ture

  # HMM模型文件路径
  hmm_model: /home/teng/claude_code/retron/database/retron_hmm/Retron_RT.hmm

  # E-value阈值
  evalue: 1e-5

  # 最小domain score阈值
  min_score: 25.0

# ============================================================
# DIAMOND搜索参数 (Step 1) - 传统方法
# ============================================================
search:
  # 最小序列相似度 (%)
  # 注意: 25%是发现远缘Retron的阈值，会产生较多候选
  min_identity: 25

  # 最小覆盖度 (%)
  min_coverage: 40

  # 批处理大小
  batch_size: 100

# ============================================================
# Tier分层分类参数 (Step 2, v2.1 新增)
# ============================================================
# 基于 NAXXH/VTG/YADD motif 的软分类系统
tier_classification:
  # Tier分类说明:
  # - Tier 1: NAXXH + VTG (高置信度) - 经典 Retron RT 标志
  # - Tier 2: 只有 NAXXH 或 VTG (潜在新型) - 需人工审查
  # - Tier 3: 有 YADD 标记或无 motif (排除) - 可能是 Group II Intron 或其他 RT

  # 是否在输出中排除 Tier 3 候选
  # 命令行: --exclude-tier3
  exclude_tier3: false

  # Step 3 使用的输入: tier1 / tier1_tier2 / all
  # - tier1: 只使用高置信度候选 (推荐)
  # - tier1_tier2: 使用 Tier 1 + Tier 2 候选
  # - all: 使用所有候选 (包括 Tier 3)
  # 命令行: --tier-input
  tier_input: tier1_tier2

# ============================================================
# RT系统发育分析参数 (Step 3) - v2.1 改进
# ============================================================
# 方法改进:
# - MAFFT: --auto -> --localpair --maxiterate 1000 (L-INS-i算法)
# - 新增: trimal -automated1 自动修剪低质量比对区域
# - FastTree: 默认 -> -lg -gamma (LG模型 + gamma分布)
phylogeny:
  # 系统发育距离阈值
  # 用于划分置信度等级：
  # - high: 距离 < 0.3
  # - medium: 0.3 <= 距离 < threshold
  # - low: threshold <= 距离 < threshold*1.5
  # - very_low: 距离 >= threshold*1.5
  distance_threshold: 0.5

  # 参考序列说明：
  # 从 paths.reference_dir 加载所有.fasta文件作为参考序列
  # 当前包含12条已知Retron RT参考序列:
  # - Ec67, Ec86, Ec73, Ec83, Ec48, Ec107, Ec78 (E. coli)
  # - MX65 (M. xanthus), ML162 (Melittangium)
  # - Sa163 (Stigmatella), Vc95 (Vibrio), Se72 (Salmonella)

# ============================================================
# 邻近蛋白提取参数 (Step 4) - Mestre方法
# ============================================================
neighbors:
  # 上下游提取距离 (kb)
  # Mestre et al., 2020 使用 ±30kb
  distance: 20

# ============================================================
# MMseqs2聚类参数 (Step 5) - Mestre方法
# ============================================================
# 注意: MMseqs2需要在单独的conda环境中运行
# conda activate mmseqs_env
clustering:
  # 最小序列一致性 (0-1)
  # Mestre et al., 2020 使用 30%
  min_seq_id: 0.3

  # 最小覆盖度 (0-1)
  # Mestre et al., 2020 使用 80%
  coverage: 0.8

  # 覆盖度模式
  # 0: 双向覆盖, 1: 目标序列覆盖, 2: 查询序列覆盖
  cov_mode: 0

# ============================================================
# Phyvalue统计关联参数 (Step 6) - Mestre方法
# ============================================================
association:
  # 置换检验次数
  # 更多次数 = 更准确但更慢
  n_permutations: 1000

  # 最小出现次数阈值
  # 蛋白簇至少出现在这么多RT邻近区域
  min_occurrence: 5

  # 最小Phyvalue阈值
  # Phyvalue = 观察值 / 期望值
  # 论文使用 > 2 作为显著关联阈值
  min_phyvalue: 2.0

  # 是否要求在多个基因组中出现
  # true: 排除物种特异性关联
  require_multi_genome: true

# ============================================================
# ncRNA共变验证参数 (Step 8)
# ============================================================
# 基于多序列比对的共变分析，验证Retron ncRNA结构
# 适用于高GC生物（如Myxobacteria ~70% GC）
ncrna:
  # RT上游序列提取长度 (bp)
  # ncRNA通常在RT起始密码子上游200-500bp范围内
  upstream: 600

  # 最小分组大小
  # 每组至少需要这么多序列才能进行共变分析
  min_group_size: 3

  # 工具依赖:
  # - MAFFT: 多序列比对 (conda install -c bioconda mafft)
  # - RNAalifold: 共识结构预测 (conda install -c bioconda viennarna)
  # - R-scape: 共变分析 (conda install -c bioconda r-scape, 可选)

# ============================================================
# 流程控制
# ============================================================
pipeline:
  # 起始步骤 (1-8)
  # 1=从头开始, 2=跳过搜索
  start_step: 1

  # 结束步骤 (1-8)
  # 推荐: 先运行到Step 5，然后切换环境运行Step 5 (MMseqs2)，再运行Step 6-8
  end_step: 8

  # 是否跳过ncRNA共变验证 (Step 8)
  # 如果只关心关联蛋白分析，可以跳过
  skip_ncrna: false

  # 已有的搜索结果文件（如果start_step > 1）
  # existing_search_results: /path/to/complete_results.tsv

# ============================================================
# 通用参数
# ============================================================
general:
  # 线程数
  threads: 8

  # 详细输出
  verbose: false

# ============================================================
# 流程步骤说明 (v2.1)
# ============================================================
# Step 0 (可选): 构建 Retron RT HMM 模型
#   - 运行: bash build_retron_hmm.sh
#   - 输出: /home/teng/claude_code/retron/database/retron_hmm/Retron_RT.hmm
#
# Step 1: RT搜索
#   方案A (DIAMOND):
#     - 输入: query_dir (参考RT序列), faa_dir (基因组蛋白)
#     - 输出: 01_search/reports/complete_results.tsv
#   方案B (HMM, v2.1 推荐):
#     - 输入: hmm_model, faa_dir (基因组蛋白)
#     - 输出: 01_hmm_search/reports/complete_results.tsv
#
# Step 2: Tier分层分类 (v2.1 新增)
#   - NAXXH: [NQDE]A..[HY] - Retron RT特征
#   - VTG: V[TS]G (C末端150aa) - Retron RT特征
#   - YADD: Y[AV]DD - Group II Intron标记 (排除)
#   - Tier 1: NAXXH + VTG (高置信度)
#   - Tier 2: 部分motif (潜在新型)
#   - Tier 3: YADD或无motif (排除)
#   - 输出: 02_motif_tier/tier1_candidates.tsv, tier2_candidates.tsv, tier3_excluded.tsv
#
# Step 3: RT系统发育分析 (v2.1 改进)
#   - MAFFT L-INS-i: --localpair --maxiterate 1000 (适用于低相似度序列)
#   - trimal: -automated1 (自动修剪低质量区域)
#   - FastTree: -lg -gamma (LG模型 + gamma分布)
#   - 输出: 03_phylogeny/retron_candidates.tsv, rt_tree.nwk
#
# Step 4: 邻近蛋白提取 (±30kb, Mestre方法)
#   - 提取RT上下游固定距离内的所有ORF
#   - 输出: 04_neighbors/all_neighbors.faa, neighbor_matrix.tsv
#
# Step 5: MMseqs2蛋白聚类
#   - 对邻近蛋白进行序列聚类
#   - 输出: 05_clustering/rt_cluster_matrix.tsv
#
# Step 6: Phyvalue统计关联分析
#   - 计算蛋白簇与RT的共现显著性
#   - 输出: 06_association/phyvalue_analysis.tsv
#
# Step 7: 综合报告与类型分类
#   - 整合所有分析结果，进行Retron类型分类 (Type I-XIII)
#   - 输出: 07_report/final_candidates.tsv
#
# Step 8: ncRNA共变验证 (可选)
#   - 基于多序列比对的共变分析
#   - 适用于高GC生物，比单序列折叠更可靠
#   - 输出: 08_ncrna/covariance_results.tsv, validated_candidates.tsv
